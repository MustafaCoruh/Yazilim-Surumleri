name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Build Windows application
        run: |
          python -m package_builder.icon assets
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name SurumIstasyonu --icon "assets/app_icon.ico" yazilim_surumleri.py
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: SurumIstasyonu-windows
          path: dist/SurumIstasyonu
          if-no-files-found: error
